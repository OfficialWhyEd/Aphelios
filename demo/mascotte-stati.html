<title>Aphelios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#EDEBE6;--ink:#141414;--ink-2:#55534E;--line:#C9C6BE;--chip:#E2E0D9;--chip-on:#141414;--chip-on-ink:#F3F1EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:20px 32px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:Syne,"IBM Plex Sans",sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.stato{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stato b{color:var(--ink);font-weight:500}
.stage{position:relative;width:100%;aspect-ratio:1;max-width:100%;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;outline:none}
.stage:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.stage img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:darken;visibility:hidden;pointer-events:none;transform-origin:50% 90%}
.stage img.on{visibility:visible;animation:bob 2.6s ease-in-out infinite}
.stage img.on.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) 1, bob 2.6s ease-in-out .35s infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.01,.99)}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.04em;padding:7px 11px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.note{font-size:13px;line-height:1.5;color:var(--ink-2);max-width:60ch;margin:0}
.note b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.stage img.on{animation:none}}
</style>
<div class="wrap">
  <header>
    <h1>Aphelios</h1>
    <div class="stato">stato <b id="stato">saluta</b></div>
  </header>
  <div class="stage" id="stage" tabindex="0" aria-label="Mascotte di WhyEd, reagisce al mouse e al tocco"></div>
  <div class="chips" id="chips"></div>
  <p class="note"><b>Passaci sopra</b>: si innamora. <b>Clic</b>: gli dai un biscotto. <b>Tieni premuto</b>: si arrabbia. <b>Doppio clic</b>: schiaffo, resta stordito. <b>Tasto destro</b>: tira fuori la mazza. <b>Esci dalla pagina</b> o lascialo solo: sbircia.</p>
</div>

const ORDER=['saluta','idle','innamorato','biscotto','arrabbiato','stordito','mazza','timido','sbircia'];
const stage=document.getElementById('stage'), chips=document.getElementById('chips'), statoEl=document.getElementById('stato');
const el={};
for(const p of POSE){const i=new Image();i.src=p.src;i.alt='';i.draggable=false;stage.appendChild(i);el[p.id]=i;}
let cur=null, manual=null, tmp=null;
function show(id,pop=true){ if(cur===id) return; for(const k in el){ el[k].classList.remove('on','pop'); } const e=el[id]; void e.offsetWidth; e.classList.add('on'); if(pop) e.classList.add('pop'); cur=id; statoEl.textContent=id; for(const c of chips.children) c.classList.toggle('on',c.dataset.id===id); }
function base(){ return manual||'idle'; }
function flash(id,ms){ clearTimeout(tmp); show(id); tmp=setTimeout(()=>show(base()),ms); }
for(const id of ORDER){const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.id=id;b.textContent=id;
  b.addEventListener('click',()=>{ manual=(id==='idle')?null:id; clearTimeout(tmp); show(id); touch(); }); chips.appendChild(b);}
let lastTouch=Date.now(), hover=false, pressT=null, alone=false;
function touch(){ lastTouch=Date.now(); if(alone){alone=false; show(base());} }
function fidget(){ if(!manual && !hover && !alone && cur==='idle'){ flash(Math.random()<0.5?'timido':'sbircia',900);} setTimeout(fidget,9000+Math.random()*12000); }
setInterval(()=>{ if(!manual && !hover && Date.now()-lastTouch>25000 && !alone){ alone=true; show('sbircia'); } },1000);
stage.addEventListener('pointerenter',()=>{hover=true;touch();clearTimeout(tmp);show('innamorato');});
stage.addEventListener('pointerleave',()=>{hover=false;touch();show(base());});
stage.addEventListener('pointerdown',e=>{ if(e.button===2) return; touch();pressT=setTimeout(()=>{pressT=null;show('arrabbiato');},450);});
stage.addEventListener('pointerup',e=>{ if(e.button===2) return; touch(); if(pressT){clearTimeout(pressT);pressT=null;flash('biscotto',1200);} else {flash('biscotto',900);} });
stage.addEventListener('pointercancel',()=>{clearTimeout(pressT);pressT=null;});
stage.addEventListener('dblclick',()=>{touch();clearTimeout(pressT);pressT=null;flash('stordito',1400);});
stage.addEventListener('contextmenu',e=>{e.preventDefault();touch();flash('mazza',1400);});
stage.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();touch();flash('biscotto',900);} });
document.addEventListener('mouseleave',()=>{ if(!manual){touch();show('sbircia');} });
document.addEventListener('mouseenter',()=>{ if(cur==='sbircia'&&!manual) show(base()); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!manual) show('sbircia'); else if(!manual) show(base()); });
show('saluta'); setTimeout(()=>{ if(!manual) show('idle'); },1800);
setTimeout(fidget,8000);
</script>
